# MiniMOTD 2.2.2 main configuration for Velocity
# Themed with dynamic palette tokens and network branding

motds=[
  {
    line1="         <gradient:__THEME_PRIMARY__:__THEME_SECONDARY__><bold>✦ __NETWORK_SHORT_NAME__ ✦</bold></gradient> <dark_gray>•</dark_gray> <gradient:__THEME_ACCENT__:__THEME_SECONDARY__><bold>SURVIVAL SMP</bold></gradient>"
    line2="<yellow>⚡</yellow> <white>__MSG_MOTD_LINE_2__</white> <dark_gray>»</dark_gray> <gray>__NETWORK_DOMAIN__</gray> <dark_gray>«</dark_gray>"
    icon=icon
  },
  {
    line1="         <gradient:__THEME_ACCENT__:__THEME_PRIMARY__><bold>✦ __NETWORK_SHORT_NAME__ ✦</bold></gradient> <dark_gray>•</dark_gray> <gradient:__THEME_PRIMARY__:__THEME_SECONDARY__><bold>SEMI-VANILLA</bold></gradient>"
    line2="<yellow>✦</yellow> <white>Discord:</white> <yellow>__NETWORK_DISCORD__</yellow> <dark_gray>«</dark_gray>"
    icon=icon
  }
]

motd-enabled=true
icon-enabled=true

player-count-settings {
  max-players-enabled=true
  max-players=__NETWORK_MAX_PLAYERS__
  disable-player-list-hover=false
  hide-player-count=false
  player-list-hover=[
    "<gradient:__THEME_PRIMARY__:__THEME_SECONDARY__><bold>✦ __NETWORK_SHORT_NAME__ ✦</bold></gradient>",
    "<gray>__MSG_TAB_SUB_HEADER__</gray>",
    "",
    "<gold>» <yellow>Mode:</yellow> <white>Survival SMP (1.21.x)</white>",
    "<gold>» <yellow>Discord:</yellow> <white>__NETWORK_DISCORD__</white>",
    "<gold>» <yellow>Website:</yellow> <white>__NETWORK_WEBSITE__</white>",
    "",
    "<gradient:__THEME_SECONDARY__:__THEME_PRIMARY__>Click to join the game!</gradient>"
  ]
  fake-players {
    fake-players="0"
    fake-players-mode=static
  }
}
