config-version = "2.7"
bind = "0.0.0.0:25565"
motd = "<gradient:__THEME_PRIMARY__:__THEME_SECONDARY__><bold>__NETWORK_SHORT_NAME__</bold></gradient> <dark_gray>»</dark_gray> <white>__MSG_MOTD_LINE_2__</white>"
online-mode = false
force-key-authentication = true
player-info-forwarding-mode = "modern"
forwarding-secret-file = "/run/secrets/forwarding_secret"
ping-passthrough = "DISABLED"
enable-player-address-logging = false
bungee-plugin-message-channel = true

[servers]
auth = "auth:25565"
lobby = "lobby:25565"
survival = "survival:25565"
try = ["lobby", "survival"]

[forced-hosts]
"localhost" = ["lobby"]
