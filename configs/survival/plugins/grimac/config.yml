# GrimAC Main Configuration
# Source: https://github.com/MWHunter/Grim

alerts:
    print-to-console: true
    proxy:
        send: false
        receive: false

verbose:
    print-to-console: false

check-for-updates: false

client-brand:
    ignored-clients:
        - "^vanilla$"
        - "^fabric$"
        - "^quilt$"
        - "^lunarclient:v\\d+\\.\\d+\\.\\d+-\\d{4},(?:fabric|forge)$"
        - "^Feather Fabric$"
        - "^labymod$"
    disconnect-blacklisted-forge-versions: true

spectators:
    hide-regardless: false
    allowed-worlds:
        - ""

max-transaction-time: 60
disable-pong-cancelling: false
disable-block-resync: false
cancel-duplicate-movement-packets: false
ignore-rotation-in-duplicate-packets: false

Simulation:
    decay: 0.05
    threshold: 0.001
    setbackvl: 60
    max-setbackvl: 200
    decay-ceiling: 1.0
    threshold-vl: 100

Phase:
    setbackvl: 1

NoSlow:
    threshold: 0.001
    setbackvl: 1
    decay: 0.05

Velocity:
    decay: 0.05
    threshold: 0.001
    setbackvl: 60
    max-setbackvl: 200
    decay-ceiling: 1.0

TimerA:
    drift: 120

TimerB:
    ping-threshold: 200
    leniency: 20

VehicleTimer:
    drift: 120

FastBreak:
    threshold-ms: 50
    block-delay-threshold-ms: 25

BadPackets:
    exempt-placing-while-digging: false

Reach:
    threshold: 0.0005
    block-impossible-hits: true
    enable-post-packet: false

exploit:
    allow-sprint-jumping-when-using-elytra: false
    allow-building-on-ghostblocks: true
    distance-to-check-if-ghostblocks: 2

debug-pipeline-on-join: false
experimental-checks: false
experimental-chunk-sharing: false

reset-item-usage-on-item-update: true
reset-item-usage-on-attack: true
reset-item-usage-on-slot-change: true
reset-item-usage-on-item-use: true

packet-spam-threshold: 100
debug-packet-cancel: false
max-ping-out-of-flying: 1000
max-ping-firework-boost: 1000

config-flavor: V2
config-version: 11
