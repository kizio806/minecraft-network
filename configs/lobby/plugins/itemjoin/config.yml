config-Version: 8
Language: 'English'

General:
  CheckforUpdates: false
  Metrics-Logging: false
  Log-Commands: false
  ignoreErrors: false
  ignoreDepend: NONE
  Debugging: false

Database:
  MySQL: false

Settings:
  HeldItem-Slot: 4
  HeldItem-Triggers: JOIN, WORLD-SWITCH
  HeldItem-Animations: false
  Default-Triggers: JOIN, WORLD-SWITCH, RESPAWN
  DataTags: true

Permissions:
  Obtain-Items: false
  Obtain-Items-OP: false
  Commands-Get: false
  Commands-OP: false
  Movement-Bypass: false
