# MiniMOTD 2.2.2 main configuration for Velocity
icon-enabled=false
motd-enabled=true
motds=[
  {
    icon=none
    line1="<gradient:#5ee7df:#b490ca><bold>Minecraft Network</bold>"
    line2="<gray>Private SMP network <dark_gray>| <white>{onlinePlayers} players"
  }
]
player-count-settings {
  disable-player-list-hover=false
  fake-players { fake-players="0" fake-players-enabled=false }
  hide-player-count=false
  just-x-more-settings { just-x-more-enabled=false x-value=3 }
  max-players=20
  max-players-enabled=true
}
